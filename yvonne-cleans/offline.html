<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f5e3a">
  <title>You're offline | Yvonne Cleans</title>
  <style>
    :root { --green: #1f5e3a; --ink: #173b2a; --muted: #5e7366; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #f6f8f4; color: var(--ink); display: grid; font-family: Arial, sans-serif; margin: 0; min-height: 100vh; padding: 1.5rem; }
    main { background: #ffffff; border: 1px solid #d8e5d9; border-radius: 22px; box-shadow: 0 16px 36px rgba(31, 94, 58, 0.1); margin: auto; max-width: 500px; padding: 2.5rem; text-align: center; }
    .mark { align-items: center; background: var(--green); border-radius: 50%; color: #ffffff; display: inline-flex; font-size: 1.8rem; height: 70px; justify-content: center; margin-bottom: 1.3rem; width: 70px; }
    h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); margin: 0 0 1rem; }
    p { color: var(--muted); line-height: 1.7; margin: 0 auto 1.5rem; max-width: 360px; }
    button { background: var(--green); border: 0; border-radius: 999px; color: #ffffff; cursor: pointer; font-size: 1rem; font-weight: 700; padding: 0.9rem 1.35rem; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">✦</span>
    <h1>You're offline.</h1>
    <p>Reconnect to the internet and try again when you're ready to request your cleaning quote.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
